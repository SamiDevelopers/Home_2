<!doctype html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام إدارة العقار المتكامل - الإصدار النهائي</title>
    <script src="https://cdn.tailwindcss.com">
    </script>
    <style>
        /* ============================================================
           CSS STYLES - نظام إدارة العقار المتكامل
           ============================================================ */
        :root {
            --primary: #1a3a5c;
            --primary-light: #2c6b9e;
            --primary-dark: #0f2840;
            --secondary: #4CAF50;
            --danger: #c62828;
            --warning: #e65100;
            --info: #1565C0;
            --bg: #f0f4f9;
            --card-bg: #ffffff;
            --text: #222;
            --text-light: #555;
            --border: #d0d7dd;
            --shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
            --radius: 10px;
            --sidebar-width: 260px;
            --header-height: 60px;
            --transition: 0.3s ease;
            --font: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            transition: background var(--transition), color var(--transition);
            overflow-x: hidden;
        }

        /* Dark Mode */
        body.dark {
            --bg: #1a1a2e;
            --card-bg: #16213e;
            --text: #eee;
            --text-light: #bbb;
            --border: #2a3a5a;
            --shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--primary-light);
            border-radius: 3px;
        }

        /* Sidebar */
        .sidebar {
            position: fixed;
            top: 0;
            right: 0;
            width: var(--sidebar-width);
            height: 100vh;
            background: var(--primary-dark);
            color: #fff;
            overflow-y: auto;
            z-index: 1000;
            transition: transform var(--transition);
            transform: translateX(0);
        }
        .sidebar.closed {
            transform: translateX(100%);
        }
        .sidebar-header {
            padding: 18px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .sidebar-header h2 {
            font-size: 18px;
            font-weight: 700;
        }
        .sidebar-toggle {
            background: none;
            border: none;
            color: #fff;
            font-size: 22px;
            cursor: pointer;
            display: none;
        }
        .sidebar-nav {
            padding: 10px 0;
        }
        .sidebar-nav a {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 20px;
            color: rgba(255, 255, 255, 0.7);
            text-decoration: none;
            transition: all var(--transition);
            border-right: 3px solid transparent;
            font-size: 14px;
            cursor: pointer;
        }
        .sidebar-nav a:hover {
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
        }
        .sidebar-nav a.active {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            border-right-color: var(--secondary);
        }
        .sidebar-nav a i {
            width: 20px;
            text-align: center;
        }

        /* Main Content */
        .main-content {
            margin-right: var(--sidebar-width);
            min-height: 100vh;
            transition: margin var(--transition);
        }
        .main-content.expanded {
            margin-right: 0;
        }

        /* Top Header */
        .top-header {
            background: var(--card-bg);
            padding: 0 24px;
            height: var(--header-height);
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: var(--shadow);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .menu-btn {
            display: none;
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: var(--text);
        }
        .header-left h1 {
            font-size: 20px;
            font-weight: 600;
        }
        .header-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .date-time {
            font-size: 13px;
            color: var(--text-light);
        }
        .notif-btn {
            position: relative;
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            color: var(--text);
        }
        .notif-badge {
            position: absolute;
            top: -6px;
            right: -8px;
            background: var(--danger);
            color: #fff;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 50%;
            min-width: 18px;
            text-align: center;
        }
        .dark-mode-btn {
            background: none;
            border: none;
            font-size: 18px;
            cursor: pointer;
            color: var(--text);
        }

        /* Notifications Panel */
        .notifications-panel {
            background: var(--card-bg);
            border-radius: var(--radius);
            margin: 12px 24px;
            padding: 16px 20px;
            box-shadow: var(--shadow);
            border-right: 4px solid var(--warning);
        }
        .notif-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .notif-header h3 {
            font-size: 16px;
        }
        .notif-header button {
            background: var(--danger);
            color: #fff;
            border: none;
            padding: 4px 14px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }
        .notification-item {
            padding: 10px 14px;
            border-radius: 6px;
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-right: 3px solid;
            background: var(--bg);
            cursor: pointer;
        }
        .notification-item.urgent {
            border-right-color: var(--danger);
        }
        .notification-item.warning {
            border-right-color: var(--warning);
        }
        .notification-item.info {
            border-right-color: var(--info);
        }
        .notif-text {
            flex: 1;
            font-size: 13px;
        }
        .notif-time {
            font-size: 11px;
            color: var(--text-light);
            margin: 0 12px;
        }
        .notif-dismiss {
            background: none;
            border: none;
            color: var(--text-light);
            cursor: pointer;
            font-size: 16px;
        }

        /* Pages */
        .page {
            display: none;
            padding: 20px 24px;
        }
        .page.active {
            display: block;
        }

        /* Cards */
        .card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 20px;
            box-shadow: var(--shadow);
            margin-bottom: 20px;
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        .card-header h3 {
            font-size: 16px;
            font-weight: 600;
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }
        .stat-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 16px 18px;
            box-shadow: var(--shadow);
            text-align: center;
            transition: transform var(--transition);
        }
        .stat-card:hover {
            transform: translateY(-3px);
        }
        .stat-card .stat-icon {
            font-size: 28px;
            margin-bottom: 6px;
        }
        .stat-card .stat-number {
            font-size: 26px;
            font-weight: 700;
            color: var(--primary);
        }
        .stat-card .stat-label {
            font-size: 12px;
            color: var(--text-light);
            margin-top: 2px;
        }

        /* Tables */
        .table-container {
            overflow-x: auto;
            border-radius: var(--radius);
            border: 1px solid var(--border);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        table th {
            background: var(--primary);
            color: #fff;
            padding: 10px 12px;
            text-align: center;
            white-space: nowrap;
            position: sticky;
            top: 0;
            z-index: 2;
        }
        table td {
            padding: 8px 10px;
            text-align: center;
            border-bottom: 1px solid var(--border);
            vertical-align: middle;
        }
        table tr:hover td {
            background: rgba(26, 58, 92, 0.04);
        }

        /* Badges */
        .badge {
            display: inline-block;
            padding: 2px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
        }
        .badge.owner {
            background: #bbdefb;
            color: #0d47a1;
        }
        .badge.tenant {
            background: #c8e6c9;
            color: #1b5e20;
        }
        .badge.closed {
            background: #f5f5f5;
            color: #616161;
        }
        .badge.living {
            background: #fff3e0;
            color: #e65100;
        }
        .badge.paid {
            background: #a5d6a7;
            color: #1b5e20;
        }
        .badge.unpaid {
            background: #ef9a9a;
            color: #b71c1c;
        }
        .badge.partial {
            background: #ffe082;
            color: #e65100;
        }
        .badge.yes {
            background: #a5d6a7;
            color: #1b5e20;
        }
        .badge.no {
            background: #ef9a9a;
            color: #b71c1c;
        }

        /* Buttons */
        .btn {
            padding: 8px 18px;
            border-radius: 6px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            font-size: 13px;
            transition: all var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn-primary {
            background: var(--primary);
            color: #fff;
        }
        .btn-primary:hover {
            background: var(--primary-light);
        }
        .btn-success {
            background: var(--secondary);
            color: #fff;
        }
        .btn-success:hover {
            background: #388E3C;
        }
        .btn-danger {
            background: var(--danger);
            color: #fff;
        }
        .btn-danger:hover {
            background: #b71c1c;
        }
        .btn-warning {
            background: var(--warning);
            color: #fff;
        }
        .btn-outline {
            background: transparent;
            color: var(--primary);
            border: 1px solid var(--primary);
        }
        .btn-outline:hover {
            background: var(--primary);
            color: #fff;
        }
        .btn-sm {
            padding: 4px 12px;
            font-size: 12px;
        }

        /* Forms */
        .form-group {
            margin-bottom: 14px;
        }
        .form-group label {
            display: block;
            font-weight: 600;
            font-size: 13px;
            color: var(--text-light);
            margin-bottom: 4px;
        }
        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: var(--bg);
            color: var(--text);
            font-size: 14px;
            transition: border var(--transition);
        }
        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(26, 58, 92, 0.1);
        }
        .form-group textarea {
            resize: vertical;
            min-height: 60px;
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        /* Modals */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            padding: 20px;
        }
        .modal-overlay.open {
            display: flex;
        }
        .modal {
            background: var(--card-bg);
            border-radius: var(--radius);
            max-width: 700px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 24px 28px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            position: relative;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        .modal-header h2 {
            font-size: 20px;
            color: var(--primary);
        }
        .modal-close {
            background: none;
            border: none;
            font-size: 28px;
            cursor: pointer;
            color: var(--text-light);
        }
        .modal-close:hover {
            color: var(--danger);
        }
        .modal-footer {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        /* Progress Bar */
        .progress-bar {
            width: 100%;
            height: 8px;
            background: var(--border);
            border-radius: 4px;
            overflow: hidden;
            margin-top: 6px;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--secondary), #388E3C);
            transition: width 0.6s ease;
            border-radius: 4px;
        }

        /* Toolbar */
        .toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            margin-bottom: 16px;
        }
        .toolbar input[type="text"],
        .toolbar select {
            padding: 6px 12px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: var(--bg);
            color: var(--text);
            font-size: 13px;
        }
        .toolbar input[type="text"] {
            flex: 1;
            min-width: 160px;
        }

        /* Receipt Print Styles */
        .receipt-print {
            border: 2px solid var(--primary);
            border-radius: 6px;
            padding: 12px 16px;
            background: #fff;
            font-size: 12px;
            line-height: 1.6;
            color: #000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            direction: rtl;
            min-height: 200px;
        }
        .receipt-print .r-header {
            text-align: center;
            border-bottom: 2px solid var(--primary);
            padding-bottom: 6px;
            margin-bottom: 6px;
        }
        .receipt-print .r-header .r-building {
            font-size: 14px;
            font-weight: 700;
            color: var(--primary);
        }
        .receipt-print .r-header .r-address {
            font-size: 11px;
            color: #333;
        }
        .receipt-print .r-header .r-receipt-type {
            font-size: 16px;
            font-weight: 700;
            color: var(--primary);
            margin-top: 4px;
            border-top: 1px dashed var(--primary);
            border-bottom: 1px dashed var(--primary);
            display: inline-block;
            padding: 2px 16px;
        }
        .receipt-print .r-body .r-row {
            display: flex;
            justify-content: space-between;
            border-bottom: 1px dotted #ccc;
            padding: 3px 0;
        }
        .receipt-print .r-body .r-row .r-label {
            font-weight: 600;
            color: var(--primary);
            font-size: 12px;
        }
        .receipt-print .r-body .r-amount {
            background: #f0f5fb;
            padding: 5px 10px;
            border-radius: 4px;
            font-weight: 700;
            font-size: 16px;
            text-align: center;
            margin: 5px 0;
            border: 2px solid var(--primary);
        }
        .receipt-print .r-body .r-statement {
            background: #f9f9f9;
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 18px;
            font-weight: 700;
            margin: 5px 0;
            border: 2px solid #ddd;
            text-align: center;
            color: var(--primary);
        }
        .receipt-print .r-body .r-statement-items {
            background: #f9f9f9;
            padding: 8px 14px;
            border-radius: 4px;
            margin: 4px 0;
            border: 2px solid #ddd;
            font-size: 14px;
            line-height: 2;
        }
        .receipt-print .r-body .r-statement-items .item::before {
            content: "• ";
            color: var(--primary);
            font-weight: 700;
        }
        .receipt-print .r-body .r-statement-items .note {
            display: block;
            color: var(--danger);
            font-weight: 600;
            border-top: 1px dashed var(--danger);
            padding-top: 3px;
            margin-top: 2px;
        }
        .receipt-print .r-footer {
            border-top: 2px solid var(--primary);
            margin-top: 5px;
            padding-top: 5px;
            text-align: center;
            font-weight: 700;
            color: var(--primary);
        }
        .receipt-print .r-id {
            text-align: left;
            font-size: 9px;
            color: #999;
            margin-top: 2px;
        }
        .receipt-grid {
            display: grid;
            gap: 12px;
            direction: rtl;
        }
        .receipt-grid.cols-1 {
            grid-template-columns: 1fr;
        }
        .receipt-grid.cols-2 {
            grid-template-columns: 1fr 1fr;
        }
        .receipt-grid.cols-3 {
            grid-template-columns: 1fr 1fr 1fr;
        }
        .receipt-grid.cols-4 {
            grid-template-columns: 1fr 1fr 1fr 1fr;
        }
        .receipt-grid.cols-6 {
            grid-template-columns: 1fr 1fr 1fr 1fr 1fr 1fr;
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 24px;
            border-radius: 8px;
            color: #fff;
            font-weight: 600;
            z-index: 3000;
            animation: slideUp 0.3s ease;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
        }
        .toast.success {
            background: var(--secondary);
        }
        .toast.error {
            background: var(--danger);
        }
        .toast.info {
            background: var(--info);
        }
        .toast.warning {
            background: var(--warning);
        }
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }

        /* Responsive */
        @media (max-width: 992px) {
            .sidebar {
                transform: translateX(100%);
            }
            .sidebar.open {
                transform: translateX(0);
            }
            .sidebar-toggle {
                display: block;
            }
            .main-content {
                margin-right: 0;
            }
            .menu-btn {
                display: block;
            }
            .form-row {
                grid-template-columns: 1fr;
            }
            .receipt-grid.cols-3,
            .receipt-grid.cols-4,
            .receipt-grid.cols-6 {
                grid-template-columns: 1fr 1fr;
            }
        }
        @media (max-width: 600px) {
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            .header-left h1 {
                font-size: 16px;
            }
            .date-time {
                font-size: 11px;
            }
            .page {
                padding: 12px;
            }
            .receipt-grid.cols-2,
            .receipt-grid.cols-3,
            .receipt-grid.cols-4,
            .receipt-grid.cols-6 {
                grid-template-columns: 1fr;
            }
        }

        /* Print Styles */
        @media print {
            .sidebar,
            .top-header,
            .notifications-panel,
            .toolbar,
            .no-print {
                display: none !important;
            }
            .main-content {
                margin: 0 !important;
                padding: 0 !important;
            }
            .page {
                padding: 0 !important;
            }
            .receipt-print {
                border-color: #000 !important;
                page-break-inside: avoid;
                break-inside: avoid;
            }
            .receipt-print .r-header .r-building,
            .receipt-print .r-header .r-receipt-type,
            .receipt-print .r-body .r-amount,
            .receipt-print .r-body .r-statement,
            .receipt-print .r-body .r-statement-items,
            .receipt-print .r-footer {
                color: #000 !important;
                border-color: #000 !important;
            }
        }
    </style>
</head>

    </div>

    <!-- ============================================================

    ============================================================ -->
    <div class="main-content" id="mainContent">
        <!-- Header -->
        <header class="top-header">
            <div class="header-left">
                <button class="menu-btn" onclick="toggleSidebar()">☰</button>
                <h1 id="pageTitle">الرئيسية</h1>
            </div>
            <div class="header-right">
                <span class="date-time" id="currentDateTime"></span>
                <button class="notif-btn" onclick="toggleNotifications()">
                    <i class="fas fa-bell"></i>
                    <span class="notif-badge" id="notifBadge">0</span>
                </button>
                <button class="dark-mode-btn" onclick="toggleDarkMode()">
                    <i class="fas fa-moon"></i>
                </button>
            </div>
        </header>

        <!-- Notifications Panel -->
        <div class="notifications-panel" id="notificationsPanel" style="display:none;">
            <div class="notif-header">
                <h3>الإشعارات</h3>
                <button onclick="clearAllNotifications()">مسح الكل</button>
            </div>
            <div id="notificationsList"></div>

        <!-- Pages -->
        <div id="page-dashboard" class="page active"></div>
        <div id="page-apartments" class="page"></div>
        <div id="page-payments" class="page"></div>
        <div id="page-debts" class="page"></div>
        <div id="page-receipts" class="page"></div>
        <div id="page-expenses" class="page"></div>
        <div id="page-special-charges" class="page"></div>
        <div id="page-funds" class="page"></div>
        <div id="page-reports" class="page"></div>
        <div id="page-archive" class="page"></div>
        <div id="page-settings" class="page"></div>
        <div id="page-backup" class="page"></div>
    </div>

    <!-- ============================================================
    MODALS CONTAINER
    ============================================================ -->
    <div id="modalContainer"></div>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        // ============================================================
        // نظام إدارة العقار المتكامل - JavaScript
        // ============================================================

        // ============================================================
        // 1. DATA LAYER - إدارة البيانات
        // ============================================================

        const AppData = {
            apartments: [],
            payments: [],
            debts: [],
            expenses: [],
            specialCharges: [],
            funds: [],
            fundTransactions: [],
            receipts: [],
            receiptTemplates: [],
            notifications: [],
            auditLogs: [],
            settings: {},
            currentMonth: '',
            currentYear: '',
            selectedIds: new Set(),

            // ============================================================
            // 1.1 تهيئة البيانات الافتراضية (27 شقة)
            // ============================================================
            initDefaultData() {
                const floors = ['البدروم', 'الأول', 'الثانى', 'الثالث', 'الرابع', 'الخامس',
                    'السادس', 'السابع', 'الثامن', 'التاسع', 'العاشر',
                    'الحادى عشر', 'الثانى عشر', 'الثالث عشر'
                ];
                const locations = ['يمين السلم', 'يسار السلم'];
                const defaultResidents = [
                    'فرج ميخائيل', 'عبد المجيد سلطان', 'رضا وهيب', 'ماجد محمد سامي',
                    'احمد شعبان فتحي', 'سيدة علي', 'مرتضي', 'فادي سمير',
                    'منتصر احمد علي', 'عاطف رزق', 'محمد عبد المنعم', 'فادي راشد',
                    'محمد يوسف', 'محمد محسن', 'خالد جمال', 'محمد السيد',
                    'عبد المعطى', 'جمعة فراج', 'سلامة ماضي', 'احمد سعيد',
                    'عاطف عبد العزيز', 'ماجدة حبيب', 'رانيا رمزي', 'مشيل انطونيوس',
                    'محمد جمال احمد', 'جورجيت حبيب', 'سامي عادل'
                ];

                this.apartments = [];
                let id = 1;

                floors.forEach((floor, fi) => {
                    for (let i = 0; i < 2; i++) {
                        const number = floor === 'البدروم' ? '0' : (fi * 100 + (i + 1) * 100 + i + 1).toString();
                        const residentIdx = (fi * 2 + i) % defaultResidents.length;

                        // تحديد النوع والحالة بشكل متنوع
                        let type, status;
                        if (fi === 0) {
                            type = 'مغلق';
                            status = 'مغلقة';
                        } else if (fi % 3 === 0) {
                            type = 'مالك';
                            status = 'ساكنة';
                        } else if (fi % 3 === 1) {
                            type = 'مستأجر';
                            status = 'ساكنة';
                        } else {
                            type = 'مالك';
                            status = fi % 2 === 0 ? 'ساكنة' : 'مغلقة';
                        }

                        this.apartments.push({
                            id: id++,
                            floor: floor,
                            number: number,
                            location: locations[i % 2],
                            resident: defaultResidents[residentIdx] || `ساكن ${id}`,
                            owner: defaultResidents[residentIdx] || `مالك ${id}`,
                            type: type,
                            status: status,
                            elevator: i === 0 ? 'نعم' : 'لا',
                            phone: '',
                            notes: '',
                            amount: 0,
                            paid: 0,
                            created_at: new Date().toISOString()
                        });
                    }
                });

                // الإعدادات الافتراضية
                this.settings = {
                    buildingName: 'ملاك برج مريم',
                    buildingAddress: '31 ش الأمراء التعاون - فيصل',
                    phone: '',
                    email: '',
                    feeOwnerElevator: 170,
                    feeOwnerNoElevator: 150,
                    feeTenant: 220,
                    feeClosed: 0,
                    receiptPrefix: 'REC',
                    receiptTitle: 'إيصال الصيانة الشهرية',
                    receiptFooter: 'شكراً لتعاونكم',
                    receiptsPerPage: 2
                };

                // قوالب الإيصالات
                this.receiptTemplates = [{
                    id: 'monthly',
                    name: 'صيانة شهرية',
                    title: 'إيصال الصيانة الشهرية',
                    items: ['إيصال الكهرباء الشهري', 'إيصال الصيانة الشهرية للاسانسير', 'صيانة العقار العامة'],
                    note: 'ملاحظة: يرجى السداد قبل نهاية الشهر'
                }, {
                    id: 'electricity',
                    name: 'كهرباء',
                    title: 'إيصال الكهرباء',
                    items: ['قيمة استهلاك الكهرباء للشهر الحالي'],
                    note: ''
                }, {
                    id: 'water',
                    name: 'مياه',
                    title: 'إيصال المياه',
                    items: ['قيمة استهلاك المياه للشهر الحالي'],
                    note: ''
                }, {
                    id: 'repair',
                    name: 'إصلاحات',
                    title: 'إيصال إصلاحات',
                    items: ['أعمال الصيانة والإصلاح'],
                    note: ''
                }];

                // الصناديق
                this.funds = [
                    { id: 'main', name: 'صندوق الصيانة العامة', balance: 0 },
                    { id: 'elevator', name: 'صندوق الأسانسير', balance: 0 },
                    { id: 'water', name: 'صندوق المياه', balance: 0 },
                    { id: 'emergency', name: 'صندوق الطوارئ', balance: 0 }
                ];

                this.recalculateAllAmounts();
                this.save();
            },

            // ============================================================
            // 1.2 حساب الرسوم
            // ============================================================
            recalculateAllAmounts() {
                const f = this.settings;
                this.apartments.forEach(apt => {
                    let amount = 0;
                    if (apt.status === 'مغلقة' || apt.type === 'مغلق') {
                        amount = f.feeClosed || 0;
                    } else if (apt.type === 'مستأجر') {
                        amount = f.feeTenant;
                    } else if (apt.type === 'مالك') {
                        amount = apt.elevator === 'نعم' ? f.feeOwnerElevator : f.feeOwnerNoElevator;
                    }
                    apt.amount = amount;
                });
            },

            calculateAmount(apt) {
                const f = this.settings;
                if (apt.status === 'مغلقة' || apt.type === 'مغلق') return f.feeClosed || 0;
                if (apt.type === 'مستأجر') return f.feeTenant;
                if (apt.type === 'مالك') return apt.elevator === 'نعم' ? f.feeOwnerElevator : f.feeOwnerNoElevator;
                return 0;
            },

            // ============================================================
            // 1.3 حفظ وتحميل
            // ============================================================
            save() {
                try {
                    const data = {
                        apartments: this.apartments,
                        payments: this.payments,
                        debts: this.debts,
                        expenses: this.expenses,
                        specialCharges: this.specialCharges,
                        funds: this.funds,
                        fundTransactions: this.fundTransactions,
                        receipts: this.receipts,
                        receiptTemplates: this.receiptTemplates,
                        notifications: this.notifications,
                        auditLogs: this.auditLogs,
                        settings: this.settings,
                        selectedIds: Array.from(this.selectedIds)
                    };
                    localStorage.setItem('propertyData', JSON.stringify(data));
                } catch (e) { console.error('Save error:', e); }
            },

            load() {
                try {
                    const saved = localStorage.getItem('propertyData');
                    if (saved) {
                        const data = JSON.parse(saved);
                        this.apartments = data.apartments || [];
                        this.payments = data.payments || [];
                        this.debts = data.debts || [];
                        this.expenses = data.expenses || [];
                        this.specialCharges = data.specialCharges || [];
                        this.funds = data.funds || [];
                        this.fundTransactions = data.fundTransactions || [];
                        this.receipts = data.receipts || [];
                        this.receiptTemplates = data.receiptTemplates || [];
                        this.notifications = data.notifications || [];
                        this.auditLogs = data.auditLogs || [];
                        this.settings = data.settings || {};
                        this.selectedIds = new Set(data.selectedIds || []);
                        return true;
                    }
                } catch (e) { console.error('Load error:', e); }
                return false;
            },

            // ============================================================
            // 1.4 العمليات الأساسية
            // ============================================================
            getApartment(id) { return this.apartments.find(a => a.id == id); },

            addApartment(apt) {
                apt.id = this.apartments.length + 1;
                apt.amount = this.calculateAmount(apt);
                apt.paid = 0;
                apt.created_at = new Date().toISOString();
                this.apartments.push(apt);
                this.addAuditLog('إضافة شقة', apt);
                this.save();
                return apt;
            },

            updateApartment(id, data) {
                const apt = this.getApartment(id);
                if (!apt) return null;
                const old = { ...apt };
                Object.assign(apt, data);
                apt.amount = this.calculateAmount(apt);
                this.addAuditLog('تعديل شقة', { old, new: apt });
                this.save();
                return apt;
            },

            deleteApartment(id) {
                this.apartments = this.apartments.filter(a => a.id != id);
                this.addAuditLog('حذف شقة', { id });
                this.save();
                return true;
            },

            addPayment(payment) {
                payment.id = 'PAY' + Date.now();
                payment.created_at = new Date().toISOString();
                payment.remaining = payment.amount - payment.paid;
                if (payment.remaining <= 0) {
                    payment.remaining = 0;
                    payment.status = 'مدفوع';
                } else if (payment.paid > 0) {
                    payment.status = 'دفع جزئي';
                } else {
                    payment.status = 'غير مدفوع';
                }
                this.payments.push(payment);
                this.addAuditLog('تسجيل دفعة', payment);
                this.save();
                this.addNotification('دفعة جديدة', `تم تسجيل دفعة للشقة ${payment.apartment_number}`);
                return payment;
            },

            addDebt(debt) {
                debt.id = 'DEBT' + Date.now();
                debt.created_at = new Date().toISOString();
                debt.remaining = debt.amount;
                debt.paid_amount = 0;
                debt.status = 'مستحقة';
                this.debts.push(debt);
                this.addAuditLog('تسجيل مديونية', debt);
                this.save();
                this.addNotification('مديونية جديدة', `تم تسجيل مديونية للشقة ${debt.apartment_number} بمبلغ ${debt.amount}`);
                return debt;
            },

            payDebt(debtId, amount, method) {
                const debt = this.debts.find(d => d.id === debtId);
                if (!debt) return null;
                const paid = Math.min(amount, debt.remaining);
                debt.paid_amount += paid;
                debt.remaining = debt.amount - debt.paid_amount;
                if (debt.remaining <= 0) {
                    debt.remaining = 0;
                    debt.status = 'مسددة بالكامل';
                } else {
                    debt.status = 'دفع جزئي';
                }
                // تسجيل دفعة السداد
                const payment = {
                    apartment_id: debt.apartment_id,
                    apartment_number: debt.apartment_number,
                    resident_name: debt.resident_name,
                    amount: paid,
                    paid: paid,
                    month: debt.month,
                    year: debt.year,
                    payment_type: 'سداد مديونية',
                    status: 'مدفوع',
                    method: method,
                    notes: `سداد مديونية: ${debt.description}`
                };
                this.addPayment(payment);
                this.addAuditLog('سداد مديونية', { debtId, amount: paid });
                this.save();
                this.addNotification('سداد مديونية', `تم سداد ${paid} من مديونية الشقة ${debt.apartment_number}`);
                return debt;
            },

            addExpense(expense) {
                expense.id = 'EXP' + Date.now();
                expense.created_at = new Date().toISOString();
                this.expenses.push(expense);
                this.addAuditLog('إضافة مصروف', expense);
                this.save();
                return expense;
            },

            addFundTransaction(transaction) {
                transaction.id = 'FUND' + Date.now();
                transaction.created_at = new Date().toISOString();
                this.fundTransactions.push(transaction);
                const fund = this.funds.find(f => f.id === transaction.fund_id);
                if (fund) {
                    fund.balance += transaction.type === 'إيراد' ? transaction.amount : -transaction.amount;
                }
                this.addAuditLog('حركة صندوق', transaction);
                this.save();
                return transaction;
            },

            addNotification(title, message, type = 'info') {
                const notif = {
                    id: Date.now().toString(),
                    title,
                    message,
                    type,
                    read: false,
                    created_at: new Date().toISOString()
                };
                this.notifications.unshift(notif);
                if (this.notifications.length > 100) this.notifications = this.notifications.slice(0, 100);
                this.save();
                return notif;
            },

            addAuditLog(action, data) {
                this.auditLogs.push({
                    id: Date.now().toString(),
                    action,
                    data: typeof data === 'string' ? data : JSON.stringify(data),
                    user: 'Admin',
                    created_at: new Date().toISOString()
                });
                if (this.auditLogs.length > 500) this.auditLogs = this.auditLogs.slice(-500);
            },

            getCurrentMonth() {
                const months = ['يناير', 'فبراير', 'مارس', 'أبريل', 'مايو', 'يونيو',
                    'يوليو', 'أغسطس', 'سبتمبر', 'أكتوبر', 'نوفمبر', 'ديسمبر'
                ];
                return months[new Date().getMonth()];
            },

            getCurrentYear() {
                return new Date().getFullYear().toString();
            }
        };

        // ============================================================
        // 2. UI CONTROLLER
        // ============================================================

        const UIController = {
            currentPage: 'dashboard',

            init() {
                if (!AppData.load()) {
                    AppData.initDefaultData();
                    AppData.save();
                }
                AppData.currentMonth = AppData.getCurrentMonth();
                AppData.currentYear = AppData.getCurrentYear();

                this.updateDateTime();
                setInterval(() => this.updateDateTime(), 1000);

                this.showPage('dashboard');
                this.renderNotifications();
                setInterval(() => this.checkNotifications(), 300000);
                setInterval(() => AppData.save(), 60000);

                if (localStorage.getItem('darkMode') === 'true') {
                    document.body.classList.add('dark');
                }
            },

            // ============================================================
            // 2.1 التنقل
            // ============================================================
            showPage(pageId) {
                document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
                const page = document.getElementById(`page-${pageId}`);
                if (page) page.classList.add('active');

                document.querySelectorAll('.sidebar-nav a').forEach(a => a.classList.remove('active'));
                const link = document.querySelector(`.sidebar-nav a[data-page="${pageId}"]`);
                if (link) link.classList.add('active');

                const titles = {
                    dashboard: 'الرئيسية',
                    apartments: 'العقار والشقق',
                    payments: 'المدفوعات',
                    debts: 'المديونيات',
                    receipts: 'الإيصالات',
                    expenses: 'المصروفات',
                    'special-charges': 'الرسوم الخاصة',
                    funds: 'الصناديق',
                    reports: 'التقارير',
                    archive: 'الأرشيف الشهري',
                    settings: 'الإعدادات',
                    backup: 'النسخ الاحتياطي'
                };
                document.getElementById('pageTitle').textContent = titles[pageId] || pageId;
                this.currentPage = pageId;
                this.renderPage(pageId);
            },

            renderPage(pageId) {
                switch (pageId) {
                    case 'dashboard':
                        this.renderDashboard();
                        break;
                    case 'apartments':
                        this.renderApartments();
                        break;
                    case 'payments':
                        this.renderPayments();
                        break;
                    case 'debts':
                        this.renderDebts();
                        break;
                    case 'receipts':
                        this.renderReceipts();
                        break;
                    case 'expenses':
                        this.renderExpenses();
                        break;
                    case 'special-charges':
                        this.renderSpecialCharges();
                        break;
                    case 'funds':
                        this.renderFunds();
                        break;
                    case 'reports':
                        this.renderReports();
                        break;
                    case 'archive':
                        this.renderArchive();
                        break;
                    case 'settings':
                        this.renderSettings();
                        break;
                    case 'backup':
                        this.renderBackup();
                        break;
                }
            },

            // ============================================================
            // 2.2 Dashboard
            // ============================================================
            renderDashboard() {
                const container = document.getElementById('page-dashboard');
                const apts = AppData.apartments;
                const payments = AppData.payments;
                const debts = AppData.debts;
                const expenses = AppData.expenses;

                const total = apts.length;
                const living = apts.filter(a => a.status === 'ساكنة').length;
                const closed = apts.filter(a => a.status === 'مغلقة').length;
                const owners = apts.filter(a => a.type === 'مالك').length;
                const tenants = apts.filter(a => a.type === 'مستأجر').length;
                const totalAmount = apts.reduce((s, a) => s + (a.amount || 0), 0);
                const totalPaid = payments.reduce((s, p) => s + (p.paid || 0), 0);
                const totalDebt = debts.filter(d => d.status !== 'مسددة بالكامل').reduce((s, d) => s + d.remaining, 0);
                const totalExpenses = expenses.reduce((s, e) => s + e.amount, 0);
                const rate = totalAmount > 0 ? ((totalPaid / totalAmount) * 100).toFixed(1) : 0;
                const remaining = totalAmount - totalPaid;

                const now = new Date();
                const overdue = debts.filter(d => {
                    if (d.status === 'مسددة بالكامل') return false;
                    return new Date(d.due_date) < now;
                });

                container.innerHTML = `
                            <div class="stats-grid">
                                <div class="stat-card"><div class="stat-icon">🏠</div><div class="stat-number">${total}</div><div class="stat-label">إجمالي الشقق</div></div>
                                <div class="stat-card"><div class="stat-icon">🟢</div><div class="stat-number">${living}</div><div class="stat-label">شقق ساكنة</div></div>
                                <div class="stat-card"><div class="stat-icon">🔴</div><div class="stat-number">${closed}</div><div class="stat-label">شقق مغلقة</div></div>
                                <div class="stat-card"><div class="stat-icon">👤</div><div class="stat-number">${owners}</div><div class="stat-label">ملاك</div></div>
                                <div class="stat-card"><div class="stat-icon">👥</div><div class="stat-number">${tenants}</div><div class="stat-label">مستأجرين</div></div>
                                <div class="stat-card"><div class="stat-icon">💰</div><div class="stat-number">${totalAmount.toFixed(2)}</div><div class="stat-label">المطلوب</div></div>
                                <div class="stat-card"><div class="stat-icon">✅</div><div class="stat-number">${totalPaid.toFixed(2)}</div><div class="stat-label">المحصل</div></div>
                                <div class="stat-card"><div class="stat-icon">⏳</div><div class="stat-number">${remaining.toFixed(2)}</div><div class="stat-label">المتبقي</div></div>
                                <div class="stat-card"><div class="stat-icon">📋</div><div class="stat-number">${totalDebt.toFixed(2)}</div><div class="stat-label">الديون</div></div>
                                <div class="stat-card"><div class="stat-icon">💸</div><div class="stat-number">${totalExpenses.toFixed(2)}</div><div class="stat-label">المصروفات</div></div>
                                <div class="stat-card"><div class="stat-icon">📊</div><div class="stat-number">${rate}%</div><div class="stat-label">نسبة التحصيل<div class="progress-bar"><div class="progress-fill" style="width:${rate}%"></div></div></div></div>
                                <div class="stat-card"><div class="stat-icon">⚠️</div><div class="stat-number">${overdue.length}</div><div class="stat-label">ديون متأخرة</div></div>
                            </div>
                            <div class="card">
                                <div class="card-header"><h3>📊 آخر العمليات</h3></div>
                                <div class="table-container">
                                    <table>
                                        <thead><tr><th>التاريخ</th><th>نوع العملية</th><th>التفاصيل</th></tr></thead>
                                        <tbody>
                                            ${AppData.auditLogs.slice(-8).reverse().map(log => `
                                                <tr><td>${new Date(log.created_at).toLocaleDateString('ar-EG')}</td><td>${log.action}</td><td>${typeof log.data === 'string' ? log.data.substring(0, 50) : '...'}</td></tr>
                                            `).join('')}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        `;
            },

            // ============================================================
            // 2.3 إدارة الشقق
            // ============================================================
            renderApartments() {
                const container = document.getElementById('page-apartments');
                const floorOrder = ['البدروم', 'الأول', 'الثانى', 'الثالث', 'الرابع', 'الخامس',
                    'السادس', 'السابع', 'الثامن', 'التاسع', 'العاشر',
                    'الحادى عشر', 'الثانى عشر', 'الثالث عشر'
                ];
                const sorted = [...AppData.apartments].sort((a, b) => {
                    const ia = floorOrder.indexOf(a.floor);
                    const ib = floorOrder.indexOf(b.floor);
                    if (ia !== ib) return ia - ib;
                    return parseInt(a.number) - parseInt(b.number);
                });

                container.innerHTML = `
                            <div class="toolbar">
                                <input type="text" id="aptSearch" placeholder="🔍 بحث باسم أو شقة..." oninput="UIController.filterApartments()">
                                <select id="aptFilterFloor" onchange="UIController.filterApartments()">

            toggleAllReceipts(checked) {

            updateReceiptPreview() {
                const id = document.getElementById('receiptTemplate').value;
                const t = AppData.receiptTemplates.find(t => t.id === id);

                const ids = Array.from(selected).map(cb => parseInt(cb.dataset.id));
                const apartments = AppData.apartments.filter(a => ids.includes(a.id));

                const container = document.getElementById('receiptPreviewContainer');
                const content = document.getElementById('receiptPreviewContent');
                const cols = parseInt(document.getElementById('receiptCols').value) || 2;
                const month = document.getElementById('receiptMonth').value || AppData.currentMonth;
                const year = document.getElementById('receiptYear').value || AppData.currentYear;
                const statement = document.getElementById('receiptStatement').value || 'إيصال الصيانة';
                const items = document.getElementById('receiptItems').value.split('\n').filter(s => s.trim());
                const note = document.getElementById('receiptNote').value || '';

                let html = `<div class="receipt-grid cols-${cols}">`;
                apartments.forEach(apt => {

                container.style.display = 'block';

                return `

                                <div class="r-header">
                                    <div class="r-building">🏢 ${bName}</div>
                                    <div class="r-address">${bAddr}</div>

                                    <div class="r-statement">📋 ${opts.statement}</div>

                                    ${opts.note ? `<div class="r-statement-items"><span class="note">${opts.note}</span></div>` : ''}
                                    <div class="r-row" style="border:none;"><span class="r-label">📆 تحريراً في:</span><span class="r-value">${today}</span></div>
                                </div>
                                <div class="r-footer"><span class="r-owner">🏢 ${bName}</span></div>
                                <div class="r-id">#${apt.id} - ${apt.number}</div>

            generateMonthlyReport() {
                const container = document.getElementById('reportContent');

                const payments = AppData.payments.filter(p => p.month === month && p.year === year);

                const total = apts.reduce((s, a) => s + (a.amount || 0), 0);
                const paid = payments.reduce((s, p) => s + p.paid, 0);
                const rate = total > 0 ? ((paid / total) * 100).toFixed(1) : 0;
                const paidCount = payments.filter(p => p.status === 'مدفوع').length;
                const partialCount = payments.filter(p => p.status === 'دفع جزئي').length;
                const unpaidCount = apts.filter(a => a.status === 'ساكنة').length - paidCount - partialCount;

            downloadBackup() {
                const data = {
                    apartments: AppData.apartments,
                    payments: AppData.payments,
                    debts: AppData.debts,
                    expenses: AppData.expenses,
                    specialCharges: AppData.specialCharges,
                    funds: AppData.funds,
                    fundTransactions: AppData.fundTransactions,
                    receipts: AppData.receipts,
                    receiptTemplates: AppData.receiptTemplates,
                    notifications: AppData.notifications,
                    auditLogs: AppData.auditLogs,
                    settings: AppData.settings,
                    exportedAt: new Date().toISOString()
                };
                const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `backup_${new Date().toISOString().split('T')[0]}.json`;
                a.click();
                URL.revokeObjectURL(url);
                this.showToast('تم تحميل النسخة الاحتياطية', 'success');
            },

            restoreBackup(event) {
                const file = event.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const data = JSON.parse(e.target.result);
                        if (!data.apartments) throw new Error('بيانات غير صالحة');
                        AppData.apartments = data.apartments || [];
                        AppData.payments = data.payments || [];
                        AppData.debts = data.debts || [];
                        AppData.expenses = data.expenses || [];
                        AppData.specialCharges = data.specialCharges || [];
                        AppData.funds = data.funds || [];
                        AppData.fundTransactions = data.fundTransactions || [];
                        AppData.receipts = data.receipts || [];
                        AppData.receiptTemplates = data.receiptTemplates || [];
                        AppData.notifications = data.notifications || [];
                        AppData.auditLogs = data.auditLogs || [];
                        AppData.settings = data.settings || {};
                        AppData.save();
                        this.showToast('تم استعادة البيانات بنجاح', 'success');
                        this.renderPage(this.currentPage);
                    } catch (err) {
                        this.showToast('خطأ في قراءة الملف', 'error');
                    }
                };
                reader.readAsText(file);
                event.target.value = '';
            },

            renderNotifications() {
                const container = document.getElementById('notificationsList');
                const badge = document.getElementById('notifBadge');
                const unread = AppData.notifications.filter(n => !n.read).length;

                badge.textContent = unread;
                badge.style.display = unread > 0 ? 'inline-block' : 'none';

                container.innerHTML = AppData.notifications.slice(0, 20).map(n => `
                            <div class="notification-item ${n.type}" onclick="UIController.markNotificationRead('${n.id}')">
                                <span class="notif-text">📌 ${n.title}: ${n.message}</span>
                                <span class="notif-time">${new Date(n.created_at).toLocaleTimeString('ar-EG')}</span>
                                <button class="notif-dismiss" onclick="event.stopPropagation();UIController.dismissNotification('${n.id}')">✕</button>
                            </div>
                        `).join('') || '<div style="text-align:center;padding:20px;color:var(--text-light);">لا توجد إشعارات</div>';
            },

            markNotificationRead(id) {
                const n = AppData.notifications.find(n => n.id === id);
                if (n) { n.read = true;
                    AppData.save();
                    this.renderNotifications(); }
            },

            dismissNotification(id) {
                AppData.notifications = AppData.notifications.filter(n => n.id !== id);
                AppData.save();
                this.renderNotifications();
            },

            clearAllNotifications() {
                AppData.notifications = [];
                AppData.save();
                this.renderNotifications();
                document.getElementById('notificationsPanel').style.display = 'none';
            },

            toggleNotifications() {
                const panel = document.getElementById('notificationsPanel');
                panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
                if (panel.style.display === 'block') {
                    AppData.notifications.forEach(n => n.read = true);
                    AppData.save();
                    this.renderNotifications();
                }
            },

            checkNotifications() {
                const now = new Date();
                AppData.debts.forEach(d => {
                    if (d.status === 'مسددة بالكامل') return;
                    if (new Date(d.due_date) < now) {
                        AppData.addNotification('⚠️ مديونية متأخرة',
                            `الشقة ${d.apartment_number} - ${d.description} (${d.remaining.toFixed(2)} جنيه)`,
                            'urgent');
                    }
                });
            },

                e.preventDefault();
                const debtId = document.getElementById('payDebtId').value;
                const amount = parseFloat(document.getElementById('payDebtAmount').value) || 0;
                const method = document.getElementById('payDebtMethod').value;

                const debt = AppData.debts.find(d => d.id === debtId);
                if (!debt || amount <= 0 || amount > debt.remaining) {

                AppData.payDebt(debtId, amount, method);
                this.closeModal();
                this.renderPage('debts');

                AppData.save();

                            <form id="addSpecialChargeForm" onsubmit="UIController.addSpecialCharge(event)">
                                <div class="form-row">
                                    <div class="form-group"><label>اسم الرسوم</label><input type="text" id="chargeName" required></div>
                                    <div class="form-group"><label>السبب</label><input type="text" id="chargeReason" required></div>
                                    <div class="form-group"><label>المبلغ</label><input type="number" id="chargeAmount" step="0.01" required></div>
                                    <div class="form-group"><label>تاريخ الاستحقاق</label><input type="date" id="chargeDueDate" required></div>
                                </div>
                                <div class="modal-footer">
                                    <button type="submit" class="btn btn-primary">💾 حفظ</button>
                                    <button type="button" class="btn btn-outline" onclick="UIController.closeModal()">إلغاء</button>
                                </div>
                            </form>
                        `);
            },

            addSpecialCharge(e) {
                e.preventDefault();
                const charge = {
                    name: document.getElementById('chargeName').value,
                    reason: document.getElementById('chargeReason').value,
                    amount: parseFloat(document.getElementById('chargeAmount').value) || 0,
                    due_date: document.getElementById('chargeDueDate').value,
                    status: 'غير مدفوع',
                    created_at: new Date().toISOString()
                };
                charge.id = 'CHG' + Date.now();
                AppData.specialCharges.push(charge);
                AppData.save();
                this.closeModal();
                this.renderPage('special-charges');
                this.showToast('تم إضافة الرسوم الخاصة', 'success');
            },

            deleteSpecialCharge(id) {
                if (!confirm('هل أنت متأكد من حذف هذه الرسوم؟')) return;
                AppData.specialCharges = AppData.specialCharges.filter(c => c.id !== id);
                AppData.save();
                this.renderPage('special-charges');
                this.showToast('تم حذف الرسوم', 'success');
            },

            // ============================================================
            // 2.23 إضافة حركة صندوق
            // ============================================================
            showAddFundTransactionModal() {
                this.showModal(`
                            <div class="modal-header"><h2>🏦 إضافة حركة صندوق</h2><button class="modal-close" onclick="UIController.closeModal()">✕</button></div>
                            <form id="addFundTransactionForm" onsubmit="UIController.addFundTransaction(event)">
                                <div class="form-group">
                                    <label>اختر الصندوق</label>
                                    <select id="fundSelect" required>
                                        ${AppData.funds.map(f => `<option value="${f.id}">${f.name} (${f.balance.toFixed(2)} جنيه)</option>`).join('')}
                                    </select>
                                </div>
                                <div class="form-row">
                                    <div class="form-group"><label>نوع الحركة</label>
                                        <select id="fundTransType" required>
                                            <option value="إيراد">💰 إيراد</option>
                                            <option value="مصروف">💸 مصروف</option>
                                        </select>
                                    </div>
                                    <div class="form-group"><label>المبلغ</label><input type="number" id="fundTransAmount" step="0.01" required></div>
                                    <div class="form-group" style="grid-column:1/-1;"><label>البيان</label><input type="text" id="fundTransDescription" required></div>
                                </div>
                                <div class="modal-footer">
                                    <button type="submit" class="btn btn-primary">💾 حفظ</button>
                                    <button type="button" class="btn btn-outline" onclick="UIController.closeModal()">إلغاء</button>
                                </div>
                            </form>
                        `);
            },

            addFundTransaction(e) {
                e.preventDefault();
                const transaction = {
                    fund_id: document.getElementById('fundSelect').value,
                    type: document.getElementById('fundTransType').value,
                    amount: parseFloat(document.getElementById('fundTransAmount').value) || 0,
                    description: document.getElementById('fundTransDescription').value
                };
                AppData.addFundTransaction(transaction);
                this.closeModal();
                this.renderPage('funds');
                this.showToast('تم إضافة الحركة', 'success');
            },

            // ============================================================
            // 2.24 أدوات مساعدة
            // ============================================================
            updateDateTime() {
                const now = new Date();
                document.getElementById('currentDateTime').textContent = now.toLocaleDateString('ar-EG', {
                    year: 'numeric',
                    month: 'long',
                    day: 'numeric',
                    weekday: 'long',
                    hour: '2-digit',
                    minute: '2-digit'
                });
            },

            toggleDarkMode() {
                document.body.classList.toggle('dark');
                localStorage.setItem('darkMode', document.body.classList.contains('dark') ? 'true' : 'false');
            },

            toggleSidebar() {
                document.getElementById('sidebar').classList.toggle('closed');
                document.getElementById('mainContent').classList.toggle('expanded');
            },

            recalculateAll() {
                AppData.recalculateAllAmounts();
                AppData.save();
                this.renderPage('apartments');
                this.showToast('تم إعادة حساب جميع الرسوم', 'success');
            },

            showToast(message, type = 'info') {
                const existing = document.querySelector('.toast');
                if (existing) existing.remove();
                const toast = document.createElement('div');
                toast.className = `toast ${type}`;
                toast.textContent = message;
                document.body.appendChild(toast);
                setTimeout(() => { if (toast.parentNode) toast.remove(); }, 3000);
            }
        };

        // ============================================================
        // 3. EXPOSE GLOBALLY
        // ============================================================
        window.toggleDarkMode = function() { UIController.toggleDarkMode(); };
        window.toggleSidebar = function() { UIController.toggleSidebar(); };
        window.toggleNotifications = function() { UIController.toggleNotifications(); };
        window.clearAllNotifications = function() { UIController.clearAllNotifications(); };
        window.showPage = function(page) { UIController.showPage(page); };

        // ============================================================
        // 4. INITIALIZE
        // ============================================================
        document.addEventListener('DOMContentLoaded', function() {
            UIController.init();
            console.log('🏢 نظام إدارة العقار المتكامل');
            console.log('📦 الشقق:', AppData.apartments.length);
            console.log('💰 المدفوعات:', AppData.payments.length);
            console.log('📋 الديون:', AppData.debts.length);
            console.log('💸 المصروفات:', AppData.expenses.length);
            console.log('📊 جاهز للاستخدام!');
        });
    </script>
</body>
</html>
